# 对外暴露：把域名流量转发到 lead-mind Service
# host 换成你的实际域名；SPA 的路由回退由镜像内 nginx 处理，这里无需额外配置
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lead-mind
  labels:
    app.kubernetes.io/name: lead-mind
spec:
  # dev 集群为 k3s，使用其内置的 Traefik 控制器（集群默认 IngressClass）
  ingressClassName: traefik
  rules:
    - host: lead-mind.dev.com
      http:
        paths:
          # 后端 API 不在这里转发：浏览器直连后端网关域名（lead-mind-backend.dev.com），
          # 跨域由网关的 Traefik CORS 中间件按来源白名单放行
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lead-mind
                port:
                  name: http
  # HTTPS：lead-mind.dev.com 是内网自建域名，Let's Encrypt 无法校验，
  # 故用 openssl 自签证书（10 年有效期）手动生成后 kubectl create secret 导入，
  # 未接入 cert-manager 自动轮换。安全上下文是 navigator.clipboard 等浏览器 API 的前提。
  tls:
    - hosts: [lead-mind.dev.com]
      secretName: lead-mind-tls
